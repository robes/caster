name: synthetic
description: >
  Synthetic binary-classification dataset generated by scikit-learn's
  make_classification. Ships with the template as a runnable example; it has no
  external source and is regenerated deterministically from a seed.
type: local                    # generated by this project; nothing public to point at
license: CC0-1.0
version: "1.0"
date_published: "2026-01-01"
distribution: local            # generated locally; bytes live in data/ + DVC
provenance: |
  Produced by the fetch stage (scripts/fetch.py), which for this example GENERATES
  the data via myproject.datasets.synthetic.generate_raw using the parameters in
  configs/fetch/synthetic.yaml and params.yaml (n_samples, n_features, seed).
  Reproduce with `dvc repro` (the fetch stage) or `python scripts/fetch.py`.
  A real dataset's fetch would download/materialize here instead, and this field
  would document those retrieval steps.
